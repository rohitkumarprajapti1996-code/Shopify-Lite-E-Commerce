<body class="bg-gray-50 text-gray-800 antialiased min-h-screen">

    <!-- Container root for the React application -->
    <div id="startup-error" style="display:none;max-width:680px;margin:40px auto;padding:24px;font-family:system-ui,sans-serif;color:#182235;background:#fff;border:1px solid #dfe8eb;border-radius:16px;box-shadow:0 8px 30px rgba(20,45,60,.08)">
      <h2 style="font-size:22px;font-weight:800;margin:0 0 8px">Shopify-Lite couldn't start</h2>
      <p style="margin:0 0 12px;color:#66758b">The page loaded, but a script failed. Please share the error below with support.</p>
      <pre id="startup-error-detail" style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f3f7f8;padding:12px;border-radius:8px"></pre>
      <button onclick="location.reload()" style="margin-top:12px;padding:10px 16px;border-radius:8px;background:#0f766e;color:#fff;font-weight:700">Reload page</button>
    </div>
    <script>
      window.addEventListener('error', function(event) {
        var box = document.getElementById('startup-error');
        var detail = document.getElementById('startup-error-detail');
        if (!box || !detail) return;
        box.style.display = 'block';
        detail.textContent = (event.message || 'Script loading error') + (event.filename ? '\\n' + event.filename : '') + (event.lineno ? ':' + event.lineno : '');
      });
      window.addEventListener('unhandledrejection', function(event) {
        var box = document.getElementById('startup-error');
        var detail = document.getElementById('startup-error-detail');
        if (!box || !detail) return;
        box.style.display = 'block';
        detail.textContent = 'Startup request failed: ' + String(event.reason && (event.reason.message || event.reason) || event.reason);
      });
    </script>

                    if (updatedCart[existingIndex].quantity + quantity > product.stock) {
                        triggerToast(`Cannot add more. Only ${product.stock} items left in stock!`, 'error');
                        return;
                    }
                    updatedCart[existingIndex].quantity += quantity;
                    setCart(updatedCart);
                } else {
                    if (quantity > product.stock) {
                        triggerToast(`Sorry, only ${product.stock} items left in stock!`, 'error');
                        return;
                    }
                    setCart([...cart, { ...product, quantity, activePrice }]);
                }
                triggerToast(`Added ${product.title} to your cart.`);
            };

            const updateCartQty = (productId, change) => {
                const updatedCart = cart.map(item => {
                    if (item.id === productId) {
                        const newQty = item.quantity + change;
                        const inventoryStock = products.find(p => p.id === productId)?.stock || 0;
                        if (newQty > inventoryStock) {
                            triggerToast(`Only ${inventoryStock} items of this product exist in our store!`, 'error');
                            return item;
                        }
                        if (newQty < 1) return null;
                        return { ...item, quantity: newQty };
                    }
                    return item;
                }).filter(Boolean);
                setCart(updatedCart);
            };

            const removeFromCart = (productId) => {
                setCart(cart.filter(item => item.id !== productId));
                triggerToast("Item removed from your shopping bag.", "error");
            };

            const copyToClipboard = (text) => {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                triggerToast("UPI ID Copied to Clipboard!");
            };

            // Database Export / Import Utilities (Resolves GitHub Pages sandbox reload loss completely)
            const exportDatabaseJson = () => {
                try {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(products, null, 2));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `shopify_lite_catalog_${Date.now()}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    triggerToast("Store catalog JSON backup generated successfully!");
                } catch {
                    triggerToast("Export failed.", "error");
                }
            };

            const importDatabaseJson = (e) => {
                e.preventDefault();
                if (!importRawJson.trim()) {
                    triggerToast("Please paste a valid JSON backup string.", "error");
                    return;
                }
                try {
                    const parsed = JSON.parse(importRawJson.trim());
                    if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].title && parsed[0].price) {
                        setProducts(parsed);
                        triggerToast(`Success! Imported ${parsed.length} items to your catalog.`);
                        setImportRawJson('');
                        setShowImportArea(false);
                    } else {
                        triggerToast("Invalid file structure. Must be a valid JSON array of products.", "error");
                    }
                } catch {
                    triggerToast("JSON Parsing failed. Please check your pasted text format.", "error");
                }
            };

            const cartSubtotal = useMemo(() => {
                return cart.reduce((total, item) => total + (item.activePrice * item.quantity), 0);
            }, [cart]);

            const calculatedGSTAmount = useMemo(() => {
                return parseFloat((cartSubtotal * 0.18).toFixed(2));
            }, [cartSubtotal]);

            const cartGrandTotal = useMemo(() => {
                return cartSubtotal + calculatedGSTAmount;
            }, [cartSubtotal, calculatedGSTAmount]);

            // Settlement payout calculation
            const merchantTotalIncoming = useMemo(() => {
                return orders.reduce((acc, o) => acc + o.total, 0);
            }, [orders]);

            const merchantPayoutSettled = useMemo(() => {
                return payoutsList.reduce((acc, p) => acc + p.amount, 0);
            }, [payoutsList]);

            const merchantPayoutPending = useMemo(() => {
                return Math.max(0, merchantTotalIncoming - merchantPayoutSettled);
            }, [merchantTotalIncoming, merchantPayoutSettled]);

            const handleSaveBankPayoutDetails = (e) => {
                e.preventDefault();
                if (!merchantBankName.trim() || !merchantAccountNo.trim() || !merchantIfsc.trim()) {
                    triggerToast("Please fill all banking fields.", "error");
                    return;
                }
                localStorage.setItem('shopify_lite_merchant_bank', merchantBankName.trim());
                localStorage.setItem('shopify_lite_merchant_account', merchantAccountNo.trim());
                localStorage.setItem('shopify_lite_merchant_ifsc', merchantIfsc.trim());
                triggerToast("Bank payout details saved securely!");
            };

            const handleInstantBankTransfer = () => {
                if (!merchantBankName || !merchantAccountNo || !merchantIfsc) {
                    triggerToast("Please configure and save your bank account credentials first!", "error");
                    return;
                }
                if (merchantPayoutPending <= 0) {
                    triggerToast("No unsettled balance available for transfer.", "warning");
                    return;
                }

                setIsPayoutTransferring(true);

                setTimeout(() => {
                    const newPayout = {
                        id: 'SETTLE-' + Math.floor(100000 + Math.random() * 900000),
                        date: new Date().toISOString().split('T')[0],
                        bankName: merchantBankName,
                        accountNo: merchantAccountNo.slice(-4).padStart(12, '*'),
                        amount: merchantPayoutPending,
                        referenceId: 'UTR' + Math.floor(1000000000 + Math.random() * 9000000000)
                    };
                    setPayoutsList([newPayout, ...payoutsList]);
                    setIsPayoutTransferring(false);
                    triggerToast(`Successfully transferred ₹${newPayout.amount.toLocaleString('en-IN')} to bank account ending in ${newPayout.bankName}!`);
                }, 2000);
            };

            const handleProcessPayment = async (e) => {
                e.preventDefault();

                if (cart.length === 0) {
                    triggerToast("Your cart is empty!", "error");
                    return;
                }

                // Mandatory fields validation
                if (!checkoutFullName.trim() || !checkoutPhone.trim() || !checkoutAddress.trim() || !checkoutPincode.trim()) {
                    triggerToast("Please fill all customer information fields.", "error");
                    return;
                }

                if (checkoutPincode.trim().length !== 6 || isNaN(checkoutPincode)) {
                    triggerToast("Please enter a valid 6-digit Pincode.", "error");
                    return;
                }

                // Live inventory check
                for (const item of cart) {
                    const currentProduct = products.find(p => p.id === item.id);
                    if (!currentProduct || currentProduct.stock < item.quantity) {
                        triggerToast(`Order failed! "${item.title}" just ran out of stock or does not have ${item.quantity} units left.`, "error");
                        return;
                    }
                }

setIsVerifyingUpi(true);
                const chosenAddress = savedDeliveryAddresses.find(address => address.id === selectedDeliveryAddressId);
                const deliveryWindow = chosenAddress?.label === 'Office' ? `, Delivery days: Monday-Friday, hours: ${chosenAddress.startTime}-${chosenAddress.endTime}` : chosenAddress?.label === 'Home' ? ', Delivery days: Monday-Sunday' : '';
                const addressLabel = chosenAddress?.label ? chosenAddress.label + ' address: ' : '';
                const finalAddress = `${addressLabel}${checkoutAddress.trim()}${checkoutLandmark.trim() ? ', Landmark: ' + checkoutLandmark.trim() : ''}, PIN: ${checkoutPincode.trim()}${deliveryWindow}`;
                try {
                    if (!currentUser || !currentUser.id) throw new Error("Please sign in again before placing an order.");
                    if (!window.ShopifySupabase?.createRazorpayOrder || !window.ShopifySupabase?.verifyRazorpayPayment) throw new Error("Secure Razorpay checkout is unavailable. Please refresh the page and try again.");
                    if (typeof window.Razorpay !== 'function') throw new Error("Razorpay Checkout could not load. Check your internet connection and refresh the page.");

                    const authClient = window.ShopifySupabase.client;
                    let { data: sessionData, error: sessionError } = await authClient.auth.getSession();
                    if (sessionError) throw sessionError;
                    if (!sessionData?.session) {
                        setIsAuthenticated(false);
                        setCurrentUser(null);
                        setAuthRole('customer');
                        setShowAuthModal(true);
                        throw new Error("Your sign-in session has expired. Please sign in again, then retry checkout.");
                    }
                    if (!sessionData.session.access_token || (sessionData.session.expires_at && sessionData.session.expires_at * 1000 <= Date.now() + 60000)) {
                        const refreshed = await authClient.auth.refreshSession();
                        if (refreshed.error || !refreshed.data?.session) {
                            setIsAuthenticated(false);
                            setCurrentUser(null);
                            setAuthRole('customer');
                            setShowAuthModal(true);
                            throw new Error("Your sign-in session expired and could not be renewed. Please sign in again, then retry checkout.");
                        }
                        sessionData = refreshed.data;
                    }

                    await window.ShopifySupabase.saveCustomerProfile({
                        fullName: checkoutFullName.trim(), phone: checkoutPhone.trim(),
                        shippingAddress: checkoutAddress.trim(), pincode: checkoutPincode.trim(), landmark: checkoutLandmark.trim()
                    }, currentUser.id);
                    setProfileDisplayName(checkoutFullName.trim());
                    setProfileAddress(checkoutAddress.trim());
                    setCurrentUser(prev => prev ? { ...prev, name: checkoutFullName.trim(), phone: checkoutPhone.trim() } : prev);
                    localStorage.setItem('shopify_lite_profile_name', checkoutFullName.trim());
                    localStorage.setItem('shopify_lite_profile_address', checkoutAddress.trim());
                    localStorage.setItem('shopify_lite_profile_phone', checkoutPhone.trim());
                    localStorage.setItem('shopify_lite_profile_pincode', checkoutPincode.trim());

                    const paymentOrder = await window.ShopifySupabase.createRazorpayOrder({
                        name: checkoutFullName.trim(), phone: checkoutPhone.trim(),
                        email: currentUser.email || '', address: finalAddress
                    }, cart.map(item => ({ id: item.id, quantity: Number(item.quantity) })));
                    if (!paymentOrder?.keyId || !paymentOrder?.razorpayOrderId || !paymentOrder?.orderId) throw new Error("Razorpay did not return all required checkout details. Please contact support before retrying.");

                    const response = await new Promise((resolve, reject) => {
                        let settled = false;
                        const finish = (callback, value) => { if (settled) return; settled = true; callback(value); };
                        const checkout = new window.Razorpay({
                            key: paymentOrder.keyId, amount: paymentOrder.amount, currency: paymentOrder.currency || 'INR',
                            name: 'Shopify.Lite', description: 'Order ' + paymentOrder.orderNumber,
                            order_id: paymentOrder.razorpayOrderId,
                            prefill: paymentOrder.customer || { name: checkoutFullName.trim(), email: currentUser.email || '', contact: checkoutPhone.trim() },
                            notes: { shopify_lite_order_id: paymentOrder.orderId }, theme: { color: '#4f46e5' },
                            modal: { ondismiss: () => finish(reject, new Error("Payment window closed. Your order has not been confirmed; check My Orders before retrying.")) },
                            handler: result => finish(resolve, result)
                        });
                        checkout.on('payment.failed', event => finish(reject, new Error(event?.error?.description || event?.error?.reason || "Payment failed. Your order has not been confirmed.")));
                        checkout.open();
                    });

                    const verified = await window.ShopifySupabase.verifyRazorpayPayment(paymentOrder.orderId, response);
                    if (verified?.status !== 'paid') throw new Error("Payment could not be verified. Your order remains unpaid; please contact support before retrying.");
                    const savedOrder = {
                        id: paymentOrder.orderNumber, orderNumber: paymentOrder.orderNumber, databaseId: paymentOrder.orderId,
                        customerName: checkoutFullName.trim(), customerPhone: checkoutPhone.trim(), customerEmail: currentUser.email || '',
                        items: cart.map(item => ({ id: item.id, title: item.title, price: item.activePrice, quantity: item.quantity })),
                        subtotal: cartSubtotal, gstAmount: calculatedGSTAmount, total: Number(paymentOrder.amount) / 100,
                        date: new Date().toISOString().split('T')[0], status: 'Confirmed', paymentStatus: 'paid',
                        shippingAddress: finalAddress, paymentMethod: 'Razorpay', transactionId: response.razorpay_payment_id
                    };
                    setOrders(prev => [savedOrder, ...prev]);
                    try {
                        await window.ShopifySupabase.sendOrderConfirmation({
                            userId: currentUser.id, email: currentUser.email, orderNumber: paymentOrder.orderNumber,
                            customerName: checkoutFullName.trim(), customerPhone: checkoutPhone.trim(), address: finalAddress,
                            paymentMethod: 'Razorpay', paymentStatus: 'paid', total: savedOrder.total,
                            items: cart.map(item => ({ title: item.title, price: item.activePrice, quantity: item.quantity }))
                        });
                    } catch (emailErr) { console.warn("Payment verified; confirmation email failed:", emailErr); }
                    setCart([]);
                    setShowPaymentGate(false);
                    setPaymentProofFile(null);
                    setPaymentReference('');
                    setProfileAddress(checkoutAddress.trim());
                    setCurrentView('customer-dashboard');
                    triggerToast("Payment verified successfully. Order " + paymentOrder.orderNumber + " is confirmed.");
                } catch (err) {
                    console.error("Razorpay checkout failed:", err);
                    triggerToast(err.message || "Could not complete secure checkout. Please try again.", "error");
                } finally {
                    setIsVerifyingUpi(false);
                }
            };

            


            const loadPaymentProofs = async () => {
                if (!currentUser || currentUser.role !== 'admin') { triggerToast('Admin sign-in is required to review payment screenshots.', 'error'); return; }
                setPaymentProofsLoading(true);
                try {
                    const { data, error } = await window.ShopifySupabase.adminClient.from('shopify_lite_payment_proofs')
                        .select('id,order_id,customer_id,storage_path,claimed_amount,transaction_reference,review_status,review_note,created_at,reviewed_at')
                        .order('created_at', { ascending: false });
                    if (error) throw error;
                    const rows = await Promise.all((data || []).map(async proof => {
                        const [{ data: order, error: orderError }, signed] = await Promise.all([
                            window.ShopifySupabase.adminClient.from('shopify_lite_orders').select('order_number,customer_name,customer_email,total,payment_status,status').eq('id', proof.order_id).maybeSingle(),
                            window.ShopifySupabase.adminClient.storage.from('shopify-payment-proofs').createSignedUrl(proof.storage_path, 600)
                        ]);
                        if (orderError) throw orderError;
                        return { ...proof, order: order || {}, signedUrl: signed?.data?.signedUrl || '', signedUrlError: signed?.error?.message || '' };
                    }));
                    setPaymentProofs(rows);
                } catch (err) { triggerToast(err.message || 'Could not load payment screenshots.', 'error'); }
                finally { setPaymentProofsLoading(false); }
            };

            const reviewPaymentProof = async (proof, decision) => {
                if (!currentUser || currentUser.role !== 'admin') { triggerToast('Admin sign-in is required.', 'error'); return; }
                if (decision === 'approved' && !window.confirm('Confirm you checked your bank/UPI statement and this exact payment is credited? Approve only after verifying the actual credit.')) return;
                const reviewNote = decision === 'approved' ? 'Admin confirmed payment against bank/UPI transaction history.' : 'Payment not verified; customer must contact store support.';
                setPaymentProofReviewBusy(proof.id);
                try {
                    const { error: proofError } = await window.ShopifySupabase.adminClient.from('shopify_lite_payment_proofs')
                        .update({ review_status: decision, review_note: reviewNote, reviewed_at: new Date().toISOString() }).eq('id', proof.id);
                    if (proofError) throw proofError;
                    if (decision === 'approved') {
                        const { error: orderError } = await window.ShopifySupabase.adminClient.from('shopify_lite_orders')
                            .update({ payment_status: 'paid', transaction_reference: proof.transaction_reference || '', paid_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('id', proof.order_id);
                        if (orderError) throw orderError;
                        setOrders(prev => prev.map(order => order.databaseId === proof.order_id ? { ...order, paymentStatus: 'paid', transactionId: proof.transaction_reference || '' } : order));
                    }
                    setPaymentProofs(prev => prev.map(p => p.id === proof.id ? { ...p, review_status: decision, review_note: reviewNote, reviewed_at: new Date().toISOString(), order: { ...p.order, payment_status: decision === 'approved' ? 'paid' : p.order?.payment_status } } : p));
                    triggerToast(decision === 'approved' ? 'Payment marked paid after admin confirmation.' : 'Payment proof rejected. Order remains unpaid.', decision === 'approved' ? 'success' : 'warning');
                } catch (err) { triggerToast(err.message || 'Could not update payment review.', 'error'); await loadPaymentProofs(); }
                finally { setPaymentProofReviewBusy(''); }
            };

            const handleUpdateOrderStatus = async (orderId, newStatus) => {
                const target = orders.find(order => String(order.id) === String(orderId) || String(order.databaseId) === String(orderId));
                if (!target || !target.databaseId) { triggerToast('This is a demo order and is not saved in Supabase.', 'error'); return; }
                try {
                    await window.ShopifySupabase.updateOrderStatus(target.databaseId, newStatus);
                    setOrders(orders.map(order => order.databaseId === target.databaseId ? { ...order, status: newStatus === 'Ordered' ? 'Pending' : newStatus } : order));
                    triggerToast('Order status saved to Supabase: ' + newStatus);
                } catch (err) { triggerToast(err.message || 'Could not update order status.', 'error'); }
            };

            const handleSaveDispatch = async (order) => {
                if (!currentUser || currentUser.role !== 'admin') { triggerToast('Admin sign-in is required to save shipment details.', 'error'); return; }
                if (!order.databaseId) { triggerToast('This demo order is not saved in Supabase.', 'error'); return; }
                const form = dispatchInputs[order.id] || {};
                const courier = 'Shiprocket';
                if (!courier) { triggerToast('Please select a logistics partner first.', 'error'); return; }
                try {
                    const result = await window.ShopifySupabase.saveDispatch(order.databaseId, {

                        trackingNumber: form.trackingNumber ?? order.trackingNumber ?? '',
                        trackingUrl: form.trackingUrl ?? order.trackingUrl ?? '',
                        warehouse: form.warehouse ?? order.warehouse ?? '',
                        status: order.status === 'Ordered' || order.status === 'Pending' ? 'Dispatched' : (order.status === 'Shipped' ? 'In Transit' : order.status)
                    });
                    setOrders(prev => prev.map(o => o.databaseId === order.databaseId ? { ...o, courier, trackingNumber: result.tracking_number || form.trackingNumber || '', trackingUrl: result.tracking_url || form.trackingUrl || '', warehouse: result.warehouse || form.warehouse || '', status: result.status || 'Dispatched' } : o));
                    triggerToast('Shipment details saved. Customer order tracking is updated.');

                                "• **BudSync Ultra-Slim 10000mAh Power Bank**: Listed at an unbelievable price of only **₹199**! Pocket-sized convenience.";

                    setIsAiTyping(false);
                }, 1000);

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col font-sans text-gray-800 antialiased select-none">
                    
                    {/* Header Strip */}
                    <div className="bg-gradient-to-r from-indigo-700 via-purple-700 to-indigo-900 text-white text-xs font-semibold py-2 px-4 text-center flex items-center justify-center gap-2 no-print">
                        <Icon name="Percent" className="h-4 w-4 animate-bounce" />
                        <span>FESTIVE SALE! Save big with 18% GST benefits and free PAN-India express home delivery on all order checkouts today!</span>
                    </div>

                    <header className="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
                            
                            {/* Brand Logo */}
                            <div 
                                onClick={() => { setCurrentView('home'); setSelectedCategory('All'); }} 
                                className="flex items-center gap-2 cursor-pointer group"
                            >
                                <div className="bg-indigo-600 text-white p-2 rounded-lg shadow-md group-hover:bg-indigo-700 transition">
                                    <Icon name="ShoppingBag" className="h-6 w-6" />

                                <span className="font-extrabold text-2xl tracking-tight bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-800 bg-clip-text text-transparent">
                                    Shopify<span className="text-gray-900">.Lite</span>

                                <input

                                    placeholder="Search clothes, earbuds, powerbanks, running shoes..."

                                                {viewingInvoiceOrder.items.map((it, idx) => (
                                                    <tr key={idx}>
                                                        <td className="p-2 font-semibold text-gray-900">{it.title}</td>
                                                        <td className="p-2 text-right">₹{(it.price / 1.18).toLocaleString('en-IN', { maximumFractionDigits: 2 })}</td>
                                                        <td className="p-2 text-center">{it.quantity}</td>
                                                        <td className="p-2 text-right">₹{((it.price / 1.18) * it.quantity).toLocaleString('en-IN', { maximumFractionDigits: 2 })}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>

                                    <div className="flex justify-end pt-4 border-t border-gray-200">
                                        <div className="w-64 text-xs space-y-1.5 text-gray-600">
                                            <div className="flex justify-between">
                                                <span>Taxable Subtotal (Excl. Tax)</span>
                                                <span className="font-medium text-gray-900">₹{(viewingInvoiceOrder.total - viewingInvoiceOrder.gstAmount).toLocaleString('en-IN', { maximumFractionDigits: 2 })}</span>
                                            </div>
                                            <div className="flex justify-between font-medium text-indigo-700">
                                                <span>GST Component Collected (18%)</span>
                                                <span>+ ₹{viewingInvoiceOrder.gstAmount.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span>Shipping Charges</span>
                                                <span className="text-emerald-600 font-bold">FREE</span>
                                            </div>
                                            <div className="flex justify-between border-t border-gray-200 pt-1.5 font-bold text-gray-900 text-sm">
                                                <span>Grand Total (Incl. Tax)</span>
                                                <span className="text-indigo-700 font-black">₹{viewingInvoiceOrder.total.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-gray-50 rounded-xl p-4 border border-gray-200/60 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 text-xs">
                                        <div>
                                            <h4 className="font-bold text-gray-900 uppercase">Payment Summary Acknowledgement</h4>
                                            <p className="text-gray-500 mt-0.5">Mode of Payment: <strong>{viewingInvoiceOrder.paymentMethod}</strong></p>
                                            <p className="text-gray-500">Transaction Ref Number: <strong>{viewingInvoiceOrder.transactionId}</strong></p>
                                        </div>
                                        <div className="text-center bg-white border border-gray-200 p-2 rounded-lg font-bold">
                                            <span className="text-emerald-600 block">{String(viewingInvoiceOrder.paymentStatus || 'pending').toUpperCase()}</span>
                                            <span className="text-gray-400 text-[8px]">SHOPIFY-LITE INVOICE</span>
                                        </div>
                                    </div>

                                    <p className="text-[9px] text-gray-400 text-center leading-relaxed">
                                        Computer-generated order invoice. Configure verified seller, GSTIN and tax details before using this as a statutory tax invoice.
                                    </p>
                                </div>

                                <div className="mt-6 pt-4 border-t border-gray-100 flex justify-end no-print">
                                    <button
                                        onClick={() => window.print()}
                                        className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-xl text-xs transition flex items-center gap-1.5"
                                    >
                                        <Icon name="Download" className="h-4 w-4" /> Print / Save Tax Invoice
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Separate Customer and Seller/Admin Login Screens */}
                    {showAuthModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 no-print">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 relative shadow-2xl border border-gray-100">
                                <button 
                                    onClick={() => setShowAuthModal(false)}
                                    className="absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-100 transition"
                                >
                                    <Icon name="X" className="h-5 w-5" />
                                </button>

                                <div className="text-center mb-6">
                                    <div className={`mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl ${authRole === 'seller' ? 'bg-indigo-100 text-indigo-700' : 'bg-teal-100 text-teal-700'}`}>
                                        <Icon name={authRole === 'seller' ? 'LayoutDashboard' : 'ShoppingBag'} className="h-6 w-6" />
                                    </div>
                                    <h2 className="text-2xl font-black text-gray-900">{authRole === 'seller' ? 'Seller / Admin Login' : 'Customer Login'}</h2>
                                    <p className="text-xs text-gray-500 mt-1">{authRole === 'seller' ? 'Authorized store management only' : 'Sign in to shop, view orders and track deliveries'}</p>
                                </div>

                                {authRole === 'customer' && (
                                    <div className="mb-6 rounded-xl border border-teal-100 bg-teal-50 px-4 py-3 text-left">
                                        <div className="text-xs font-extrabold uppercase tracking-wider">Customer account</div>
                                        <p className="mt-1 text-xs text-gray-600">Shop products, manage your profile and track your own orders.</p>
                                    </div>
                                )}

                                <form onSubmit={handleAuthSubmit} className="space-y-4">
                                    {authRole === 'customer' ? (
                                        <>
                                            <div>
                                                <label className="block text-[10px] font-extrabold text-gray-500 uppercase mb-1 tracking-wider">Email Address</label>
                                                <div className="relative">
                                                    <Icon name="Mail" className="absolute left-3 top-3 h-4 w-4 text-gray-400" />
                                                    <input type="email" required autoComplete="email" placeholder="you@example.com" value={customerEmail} onChange={e => setCustomerEmail(e.target.value)} className="w-full pl-10 pr-4 py-3 border rounded-xl text-sm bg-white" />
                                                </div>
                                            </div>
                                            {(authMode === 'forgot' && emailOtpSent || authMode === 'signup' && emailOtpSent) && (
                                                <div>
                                                    <label className="block text-[10px] font-extrabold text-gray-500 uppercase mb-1 tracking-wider">Email verification code</label>
                                                    <input type="text" inputMode="numeric" autoComplete="one-time-code" required value={authOtp} onChange={e=>setAuthOtp(e.target.value)} placeholder="Enter code from email" className="w-full px-4 py-3 border rounded-xl text-sm" />
                                                </div>
                                            )}
                                            {authMode !== 'forgot' && (authMode !== 'signup' || emailOtpSent) || authMode === 'forgot' && emailOtpSent ? (
                                                <>
                                                    <div>
                                                        <label className="block text-[10px] font-extrabold text-gray-500 uppercase mb-1 tracking-wider">{authMode === 'forgot' ? 'New password' : 'Password'}</label>
                                                        <div className="relative"><input type={showCustomerPassword ? 'text' : 'password'} required autoComplete={authMode === 'login' ? 'current-password' : 'new-password'} value={customerPassword} onChange={e=>setCustomerPassword(e.target.value)} placeholder={authMode === 'forgot' ? 'At least 8 characters' : 'Enter password'} className="w-full px-4 pr-12 py-3 border rounded-xl text-sm" /><button type="button" aria-label={showCustomerPassword ? 'Hide password' : 'Show password'} onClick={()=>setShowCustomerPassword(v=>!v)} className="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg p-2 text-gray-500 hover:bg-gray-100"><Icon name={showCustomerPassword ? 'EyeOff' : 'Eye'} className="h-4 w-4"/></button></div>
                                                    </div>
                                                    {authMode !== 'login' && (
                                                        <div>
                                                            <label className="block text-[10px] font-extrabold text-gray-500 uppercase mb-1 tracking-wider">Confirm password</label>
                                                            <div className="relative"><input type={showConfirmPassword ? 'text' : 'password'} required autoComplete="new-password" value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} placeholder="Re-enter password" className="w-full px-4 pr-12 py-3 border rounded-xl text-sm" /><button type="button" aria-label={showConfirmPassword ? 'Hide password' : 'Show password'} onClick={()=>setShowConfirmPassword(v=>!v)} className="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg p-2 text-gray-500 hover:bg-gray-100"><Icon name={showConfirmPassword ? 'EyeOff' : 'Eye'} className="h-4 w-4"/></button></div>
                                                        </div>
                                                    )}
                                                </>
                                            ) : null}
                                            <div className="flex flex-wrap justify-between gap-3 text-xs font-semibold">
                                                {authMode === 'login' ? (
                                                    <>
                                                        <button type="button" onClick={()=>{setAuthMode('signup');setEmailOtpSent(false);setAuthOtp('');setCustomerPassword('');setConfirmPassword('');}} className="text-indigo-700">Create customer account</button>
                                                        <button type="button" onClick={()=>{setAuthMode('forgot');setEmailOtpSent(false);setAuthOtp('');setCustomerPassword('');setConfirmPassword('');}} className="text-gray-500">Forgot password?</button>
                                                    </>
                                                ) : (
                                                    <button type="button" onClick={()=>{setAuthMode('login');setEmailOtpSent(false);setAuthOtp('');setCustomerPassword('');setConfirmPassword('');}} className="text-indigo-700">Back to sign in</button>
                                                )}
                                            </div>
                                        </>
                                    ) : (
                                        <>
                                            <div>
                                                <label className="block text-[10px] font-extrabold text-gray-500 uppercase mb-1 tracking-wider">Admin email</label>
                                                <input type="email" required autoComplete="username" placeholder="Admin email address" value={sellerEmail} onChange={e=>setSellerEmail(e.target.value)} className="w-full px-4 py-3 border rounded-xl text-sm" />
                                            </div>
                                            {authMode === 'forgot' && (
                                                <div>
                                                    <label className="block text-[10px] font-extrabold text-gray-500 uppercase mb-1 tracking-wider">Email verification code</label>
                                                    <input type="text" inputMode="numeric" autoComplete="one-time-code" required={emailOtpSent} value={authOtp} onChange={e=>setAuthOtp(e.target.value)} placeholder={emailOtpSent ? "Enter code from admin email" : "Code will be requested first"} className="w-full px-4 py-3 border rounded-xl text-sm" />
                                                </div>
                                            )}
                                            {authMode !== 'forgot' || emailOtpSent ? (
                                                <>
                                                    <div>
                                                        <label className="block text-[10px] font-extrabold text-gray-500 uppercase mb-1 tracking-wider">{authMode === 'forgot' ? 'New admin password' : 'Admin password'}</label>
                                                        <div className="relative"><input type={showSellerPassword ? 'text' : 'password'} required autoComplete={authMode === 'forgot' ? 'new-password' : 'current-password'} value={sellerPassword} onChange={e=>setSellerPassword(e.target.value)} placeholder={authMode === 'forgot' ? 'At least 8 characters' : 'Enter admin password'} className="w-full px-4 pr-12 py-3 border rounded-xl text-sm" /><button type="button" aria-label={showSellerPassword ? 'Hide admin password' : 'Show admin password'} onClick={()=>setShowSellerPassword(v=>!v)} className="absolute right-2 top-1/2 -translate-y-1/2 rounded-lg p-2 text-gray-500 hover:bg-gray-100"><Icon name={showSellerPassword ? 'EyeOff' : 'Eye'} className="h-4 w-4"/></button></div>
                                                    </div>
                                                    {authMode === 'forgot' && (
                                                        <div>
                                                            <label className="block text-[10px] font-extrabold text-gray-500 uppercase mb-1 tracking-wider">Confirm password</label>
                                                            <input type="password" required value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} placeholder="Re-enter password" className="w-full px-4 py-3 border rounded-xl text-sm" />
                                                        </div>
                                                    )}
                                                </>
                                            ) : null}
                                            {authMode === 'login' ? (
                                                <button type="button" onClick={()=>{setAuthMode('forgot');setEmailOtpSent(false);setAuthOtp('');setSellerPassword('');setConfirmPassword('');setAuthError('');}} className="text-xs font-semibold text-indigo-700">Forgot admin password?</button>
                                            ) : (
                                                <button type="button" onClick={()=>{setAuthMode('login');setEmailOtpSent(false);setAuthOtp('');setSellerPassword('');setConfirmPassword('');setAuthError('');}} className="text-xs font-semibold text-indigo-700">Back to admin login</button>
                                            )}
                                        </>
                                    )}
                                    {authError && <div role="alert" className="rounded-xl border border-red-200 bg-red-50 px-3 py-3 text-sm font-semibold text-red-700 break-words">{authError}</div>}
                                    <div className="pt-2">
                                        <button type="submit" disabled={authBusy} className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-wait text-white font-bold py-3 px-4 rounded-xl text-sm shadow-md transition flex items-center justify-center gap-2">
                                            <Icon name="Lock" className="h-4 w-4" />
                                            {authBusy ? 'Please wait…' : authRole === 'customer'
                                                ? (authMode === 'signup' ? (!emailOtpSent ? 'Send email code' : 'Verify code & create account') : authMode === 'forgot' ? (!emailOtpSent ? 'Send recovery code' : 'Verify code & reset password') : 'Sign in with password')
                                                : (authMode === 'forgot' ? (!emailOtpSent ? 'Send recovery code' : 'Verify code & reset password') : 'Admin sign in')}
                                        </button>
                                    </div>
                                </form>

                                <div className="text-center mt-4">
                                    <p className="text-[10px] text-gray-400 leading-relaxed">
                                        Credential validations are safely processed under an automated, encrypted session environment.
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Floating Smart AI Chat Widget */}
                    <div className="fixed bottom-6 right-6 z-40 no-print">
                        {!showAiAssistant ? (
                            <button
                                onClick={() => setShowAiAssistant(true)}
                                className="bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-full shadow-2xl flex items-center gap-2 hover:scale-105 transition animate-in fade-in zoom-in duration-200"
                                title="Ask AI Assistant"
                            >
                                <Icon name="Sparkles" className="h-6 w-6 animate-pulse" />
                                <span className="text-xs font-bold pr-1">Shop AI</span>
                            </button>
                        ) : (
                            <div className="bg-white border border-gray-200 rounded-3xl shadow-2xl w-80 sm:w-96 flex flex-col overflow-hidden h-[420px] animate-in slide-in-from-bottom-5 duration-200">
                                <div className="bg-indigo-600 p-4 text-white flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <Icon name="Sparkles" className="h-5 w-5 text-indigo-100" />
                                        <div>
                                            <h4 className="font-extrabold text-xs">AI Shop Assistant</h4>
                                            <p className="text-[10px] text-indigo-200">Powered by Shopify-Lite Smart Engine</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setShowAiAssistant(false)}
                                        className="text-indigo-200 hover:text-white p-1"
                                    >
                                        <Icon name="X" className="h-5 w-5" />
                                    </button>
                                </div>

                                <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50">
                                    {chatMessages.map((msg, index) => (
                                        <div key={index} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`p-3 rounded-2xl max-w-[85%] text-[11px] leading-relaxed whitespace-pre-line ${
                                                msg.sender === 'user' 
                                                    ? 'bg-indigo-600 text-white rounded-br-none' 
                                                    : 'bg-white border border-gray-200 text-gray-700 rounded-bl-none shadow-xs'
                                            }`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                    {isAiTyping && (
                                        <div className="flex justify-start">
                                            <div className="bg-white border border-gray-200 p-3 rounded-2xl rounded-bl-none text-[11px] text-gray-500 italic">
                                                AI is scanning listings...
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <form onSubmit={handleAiSendMessage} className="p-3 border-t border-gray-100 flex gap-2 bg-white">
                                    <input
                                        type="text"
                                        placeholder="e.g. Show beauty sale items..."
                                        value={userChatInput}
                                        onChange={(e) => setUserChatInput(e.target.value)}
                                        className="flex-1 px-3 py-2 border border-gray-200 rounded-xl text-[11px] focus:outline-none focus:ring-1 focus:ring-indigo-500"
                                    />
                                    <button 
                                        type="submit"
                                        className="bg-indigo-600 text-white p-2 rounded-xl hover:bg-indigo-700 transition"
                                    >
                                        <Icon name="ArrowRight" className="h-4 w-4" />
                                    </button>
                                </form>
                            </div>
                        )}
                    </div>

                    {/* Platform Footer */}
                    <footer className="bg-white border-t border-gray-200 py-8 mt-auto no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4 text-center text-xs text-gray-400">
                            <div className="flex items-center gap-2 justify-center">
                                <div className="bg-gray-100 p-1.5 rounded text-gray-500">
                                    <Icon name="ShoppingBag" className="h-4 w-4" />
                                </div>
                                <span>© 2026 Shopify.Lite India. RWH - Mail Hub Plot No-23, Tower-2 Ground floor Navi Mumbai -400703. All tax invoicing calculations comply with standard CGST / SGST regulations.</span>
                            </div>
                            <div className="flex gap-4 justify-center">
                                <span className="hover:text-indigo-600 cursor-pointer">Security Center</span>
                                <span className="hover:text-indigo-600 cursor-pointer">Merchant Terms</span>
                                <span className="hover:text-indigo-600 cursor-pointer">GST Helplines</span>
                            </div>
                        </div>
                    </footer>

                </div>
            );
        }

        // Render the fully configured application onto root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
