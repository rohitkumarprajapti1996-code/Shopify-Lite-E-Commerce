    <script>
      window.addEventListener('error', function(event) {
        var box = document.getElementById('startup-error');
        var detail = document.getElementById('startup-error-detail');
        if (!box || !detail) return;
        box.style.display = 'block';
        detail.textContent = (event.message || 'Script loading error') + (event.filename ? '\\n' + event.filename : '') + (event.lineno ? ':' + event.lineno : '');
      });
      window.addEventListener('unhandledrejection', function(event) {
        var box = document.getElementById('startup-error');
        var detail = document.getElementById('startup-error-detail');
        if (!box || !detail) return;
        box.style.display = 'block';
        detail.textContent = 'Startup request failed: ' + String(event.reason && (event.reason.message || event.reason) || event.reason);
      });
    </script>

                                    if (savedSession.error) throw new Error('Email verified but session could not be saved: ' + savedSession.error.message);
                                }
                            }
                            if (!activeUser || (activeUser.email || '').toLowerCase() !== email) {
                                const refreshed = await auth.auth.getUser();
                                if (refreshed.error || !refreshed.data?.user || (refreshed.data.user.email || '').toLowerCase() !== email) {
                                    throw new Error('Email code was verified, but no admin session was found. Request a new code and try again.');
                                }
                            }
                            const changed = await auth.auth.updateUser({ password:sellerPassword });
                            if (changed.error) throw new Error('Email verified, but saving the password failed: ' + changed.error.message);
                            setAuthMode('login'); setEmailOtpSent(false); setAuthOtp(''); setSellerPassword(''); setConfirmPassword('');
                            await auth.auth.signOut();
                            triggerToast('Admin password created successfully. Now sign in using your email and new password.');
                            return;

                        const result = await auth.auth.signInWithPassword({ email, password:sellerPassword });
                        if (result.error) throw result.error;
                        const allowed = await window.ShopifySupabase.isAdmin();
                        if (!allowed) { await auth.auth.signOut(); throw new Error('This account is not on the Shopify-Lite admin allow-list.'); }
                        // Admin session starts with no customer-specific profile values.
                        ['shopify_lite_profile_name','shopify_lite_profile_address','shopify_lite_profile_phone','shopify_lite_profile_pincode'].forEach(k => localStorage.removeItem(k));

                        setProfileAddress('');
                        setCheckoutFullName('');
                        setCheckoutPhone('');
                        setCheckoutAddress('');
                        setCheckoutPincode('');
                        setIsAuthenticated(true);
                        setCurrentUser({ id:result.data.user.id, name:'Shopify-Lite Admin', email:result.data.user.email || email, role:'admin' });
                        setShowAuthModal(false); setCurrentView('seller-dashboard'); setSellerActiveTab('inventory'); triggerToast('Admin signed in successfully.');
                    }
                    setCustomerPassword(''); setSellerPassword(''); setConfirmPassword('');
                } catch (err) {
                    console.error('Authentication error:', err);
                    const message = err?.message || 'Authentication failed. Check your email and password.';

            const handleSaveProfile = async (e) => {
                e.preventDefault();
                if (!currentUser?.id) { triggerToast("Please sign in again to save your profile.", "error"); return; }
                if (!profileDisplayName.trim()) { triggerToast("Profile name cannot be blank.", "error"); return; }
                if (!profileAddress.trim()) { triggerToast("Address detail cannot be blank.", "error"); return; }

                        fullName: profileDisplayName.trim(), phone: checkoutPhone.trim(),

                    }, currentUser.id);

                }
            };

            const handleLogout = async () => {
                try { await window.ShopifySupabase.client.auth.signOut(); } catch (err) { console.warn(err); }
                setOtpSent(false);
                setIsAuthenticated(false);
                setCurrentUser(null);
                setCart([]);
                setCurrentView('home');
                triggerToast("Successfully signed out of your account.");
            };

            const addToCart = (product, quantity = 1) => {
                const activePrice = product.salePrice !== null ? product.salePrice : product.price;
                const existingIndex = cart.findIndex(item => item.id === product.id);
                
                if (existingIndex > -1) {
                    const updatedCart = [...cart];
                    if (updatedCart[existingIndex].quantity + quantity > product.stock) {
                        triggerToast(`Cannot add more. Only ${product.stock} items left in stock!`, 'error');
                        return;
                    }
                    updatedCart[existingIndex].quantity += quantity;
                    setCart(updatedCart);
                } else {
                    if (quantity > product.stock) {
                        triggerToast(`Sorry, only ${product.stock} items left in stock!`, 'error');
                        return;
                    }
                    setCart([...cart, { ...product, quantity, activePrice }]);
                }
                triggerToast(`Added ${product.title} to your cart.`);
            };

            const updateCartQty = (productId, change) => {
                const updatedCart = cart.map(item => {
                    if (item.id === productId) {
                        const newQty = item.quantity + change;
                        const inventoryStock = products.find(p => p.id === productId)?.stock || 0;
                        if (newQty > inventoryStock) {
                            triggerToast(`Only ${inventoryStock} items of this product exist in our store!`, 'error');
                            return item;
                        }
                        if (newQty < 1) return null;
                        return { ...item, quantity: newQty };
                    }
                    return item;
                }).filter(Boolean);
                setCart(updatedCart);
            };

            const removeFromCart = (productId) => {
                setCart(cart.filter(item => item.id !== productId));
                triggerToast("Item removed from your shopping bag.", "error");
            };

            const copyToClipboard = (text) => {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                triggerToast("UPI ID Copied to Clipboard!");
            };

            // Database Export / Import Utilities (Resolves GitHub Pages sandbox reload loss completely)
            const exportDatabaseJson = () => {
                try {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(products, null, 2));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", `shopify_lite_catalog_${Date.now()}.json`);
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                    triggerToast("Store catalog JSON backup generated successfully!");
                } catch {
                    triggerToast("Export failed.", "error");
                }
            };

            const importDatabaseJson = (e) => {
                e.preventDefault();
                if (!importRawJson.trim()) {
                    triggerToast("Please paste a valid JSON backup string.", "error");
                    return;
                }
                try {
                    const parsed = JSON.parse(importRawJson.trim());
                    if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].title && parsed[0].price) {
                        setProducts(parsed);
                        triggerToast(`Success! Imported ${parsed.length} items to your catalog.`);
                        setImportRawJson('');
                        setShowImportArea(false);
                    } else {
                        triggerToast("Invalid file structure. Must be a valid JSON array of products.", "error");
                    }
                } catch {
                    triggerToast("JSON Parsing failed. Please check your pasted text format.", "error");
                }
            };

            const cartSubtotal = useMemo(() => {
                return cart.reduce((total, item) => total + (item.activePrice * item.quantity), 0);
            }, [cart]);

            const calculatedGSTAmount = useMemo(() => {
                return parseFloat((cartSubtotal * 0.18).toFixed(2));
            }, [cartSubtotal]);

            const cartGrandTotal = useMemo(() => {
                return cartSubtotal + calculatedGSTAmount;
            }, [cartSubtotal, calculatedGSTAmount]);

            // Settlement payout calculation
            const merchantTotalIncoming = useMemo(() => {
                return orders.reduce((acc, o) => acc + o.total, 0);
            }, [orders]);

            const merchantPayoutSettled = useMemo(() => {
                return payoutsList.reduce((acc, p) => acc + p.amount, 0);
            }, [payoutsList]);

            const merchantPayoutPending = useMemo(() => {
                return Math.max(0, merchantTotalIncoming - merchantPayoutSettled);
            }, [merchantTotalIncoming, merchantPayoutSettled]);

            const handleSaveBankPayoutDetails = (e) => {
                e.preventDefault();
                if (!merchantBankName.trim() || !merchantAccountNo.trim() || !merchantIfsc.trim()) {
                    triggerToast("Please fill all banking fields.", "error");
                    return;

                localStorage.setItem('shopify_lite_merchant_bank', merchantBankName.trim());
                localStorage.setItem('shopify_lite_merchant_account', merchantAccountNo.trim());
                localStorage.setItem('shopify_lite_merchant_ifsc', merchantIfsc.trim());
                triggerToast("Bank payout details saved securely!");
            };

            const handleInstantBankTransfer = () => {
                if (!merchantBankName || !merchantAccountNo || !merchantIfsc) {
                    triggerToast("Please configure and save your bank account credentials first!", "error");
                    return;
                }
                if (merchantPayoutPending <= 0) {
                    triggerToast("No unsettled balance available for transfer.", "warning");
                    return;
                }

                setIsPayoutTransferring(true);

                setTimeout(() => {
                    const newPayout = {
                        id: 'SETTLE-' + Math.floor(100000 + Math.random() * 900000),
                        date: new Date().toISOString().split('T')[0],
                        bankName: merchantBankName,
                        accountNo: merchantAccountNo.slice(-4).padStart(12, '*'),
                        amount: merchantPayoutPending,
                        referenceId: 'UTR' + Math.floor(1000000000 + Math.random() * 9000000000)
                    };
                    setPayoutsList([newPayout, ...payoutsList]);
                    setIsPayoutTransferring(false);
                    triggerToast(`Successfully transferred ₹${newPayout.amount.toLocaleString('en-IN')} to bank account ending in ${newPayout.bankName}!`);
                }, 2000);
            };

            const handleProcessPayment = async (e) => {
                e.preventDefault();

                    triggerToast("Your cart is empty!", "error");
                    return;
                }

                // Mandatory fields validation
                if (!checkoutFullName.trim() || !checkoutPhone.trim() || !checkoutAddress.trim() || !checkoutPincode.trim()) {
                    triggerToast("Please fill all customer information fields.", "error");
                    return;
                }

                if (checkoutPincode.trim().length !== 6 || isNaN(checkoutPincode)) {
                    triggerToast("Please enter a valid 6-digit Pincode.", "error");
                    return;
                }

                // Live inventory check
                for (const item of cart) {
                    const currentProduct = products.find(p => p.id === item.id);
                    if (!currentProduct || currentProduct.stock < item.quantity) {
                        triggerToast(`Order failed! "${item.title}" just ran out of stock or does not have ${item.quantity} units left.`, "error");
                        return;
                    }
                }

setIsVerifyingUpi(true);
                const finalAddress = `${checkoutAddress.trim()}${checkoutLandmark.trim() ? ', Landmark: ' + checkoutLandmark.trim() : ''}, PIN: ${checkoutPincode.trim()}`;
                try {
                    if (!currentUser || !currentUser.id) throw new Error("Please sign in again before placing an order.");
                    await window.ShopifySupabase.saveCustomerProfile({
                        fullName: checkoutFullName.trim(), phone: checkoutPhone.trim(),
                        shippingAddress: checkoutAddress.trim(), pincode: checkoutPincode.trim(), landmark: checkoutLandmark.trim()
                    }, currentUser.id);
                    setProfileDisplayName(checkoutFullName.trim());
                    setProfileAddress(checkoutAddress.trim());
                    setCurrentUser(prev => prev ? { ...prev, name: checkoutFullName.trim(), phone: checkoutPhone.trim() } : prev);
                    localStorage.setItem('shopify_lite_profile_name', checkoutFullName.trim());
                    localStorage.setItem('shopify_lite_profile_address', checkoutAddress.trim());
                    localStorage.setItem('shopify_lite_profile_phone', checkoutPhone.trim());
                    localStorage.setItem('shopify_lite_profile_pincode', checkoutPincode.trim());
                    if (!window.Razorpay) throw new Error("Razorpay Checkout did not load. Refresh the page and try again.");
                    const paymentOrder = await window.ShopifySupabase.createRazorpayOrder({
                        name: checkoutFullName.trim(),
                        phone: checkoutPhone.trim(),
                        email: currentUser?.email || '',
                        address: finalAddress
                    }, cart.map(item => ({ id: item.id, quantity: item.quantity })));

                    setIsVerifyingUpi(false);
                    const checkout = new window.Razorpay({
                        key: paymentOrder.keyId,
                        amount: paymentOrder.amount,
                        currency: paymentOrder.currency || 'INR',
                        name: 'Shopify.Lite',
                        description: `Order ${paymentOrder.orderNumber}`,
                        order_id: paymentOrder.razorpayOrderId,
                        prefill: {
                            name: paymentOrder.customer?.name || checkoutFullName.trim(),
                            email: paymentOrder.customer?.email || currentUser?.email || '',
                            contact: paymentOrder.customer?.contact || checkoutPhone.trim()
                        },
                        notes: { store_order_number: paymentOrder.orderNumber },
                        theme: { color: '#4f46e5' },
                        handler: async function (response) {
                            setIsVerifyingUpi(true);
                            try {
                                const verified = await window.ShopifySupabase.verifyRazorpayPayment(paymentOrder.orderId, response);
                                const savedOrder = {
                                    id: paymentOrder.orderNumber,
                                    databaseId: paymentOrder.orderId,
                                    customerName: checkoutFullName.trim(),
                                    customerPhone: checkoutPhone.trim(),
                                    customerEmail: currentUser?.email || '',
                                    items: cart.map(item => ({ id: item.id, title: item.title, price: item.activePrice, quantity: item.quantity })),
                                    subtotal: cartSubtotal,
                                    gstAmount: calculatedGSTAmount,
                                    total: cartGrandTotal,
                                    date: new Date().toISOString().split('T')[0],
                                    status: 'Pending',
                                    paymentStatus: verified.status,
                                    shippingAddress: finalAddress,
                                    paymentMethod: 'Razorpay',
                                    transactionId: verified.paymentId
                                };
                                setOrders([savedOrder, ...orders]);
                                try {
                                    await window.ShopifySupabase.sendOrderConfirmation({
                                        userId: currentUser.id, email: currentUser.email,
                                        orderNumber: paymentOrder.orderNumber, customerName: checkoutFullName.trim(),
                                        customerPhone: checkoutPhone.trim(), address: finalAddress,
                                        paymentMethod: 'Razorpay', paymentStatus: verified.status,
                                        total: cartGrandTotal,
                                        items: cart.map(item => ({ title: item.title, price: item.activePrice, quantity: item.quantity }))
                                    });
                                    triggerToast("Order confirmation email sent to " + currentUser.email + ".");
                                } catch (emailErr) {
                                    console.warn("Order saved, but confirmation email failed:", emailErr);
                                    triggerToast("Payment confirmed. Email confirmation needs setup; your order is saved.", "error");
                                }
                                setCart([]);
                                setShowPaymentGate(false);
                                setPaymentCardNumber('');
                                setPaymentCardName('');
                                setPaymentCardExpiry('');
                                setPaymentCardCvv('');
                                setProfileAddress(checkoutAddress.trim());
                                setCurrentView('customer-dashboard');
                                triggerToast(`Payment verified successfully for order ${paymentOrder.orderNumber}.`);
                            } catch (verifyErr) {
                                console.error('Razorpay verification:', verifyErr);
                                triggerToast(verifyErr.message || 'Payment could not yet be verified. Do not pay again; check order status or contact support.', 'error');
                            } finally {
                                setIsVerifyingUpi(false);
                            }
                        },
                        modal: {
                            ondismiss: function () {
                                setIsVerifyingUpi(false);
                                triggerToast('Checkout closed. If you completed a payment, wait for verification before trying again.', 'error');
                            },
                            confirm_close: true,
                            escape: true
                        }
                    });
                    checkout.on('payment.failed', function (response) {
                        setIsVerifyingUpi(false);
                        triggerToast(response?.error?.description || 'Payment failed. You can try again after checking your order status.', 'error');
                    });
                    checkout.open();
                } catch (err) {
                    console.error("Razorpay checkout start failed:", err);
                    setIsVerifyingUpi(false);
                    triggerToast(err.message || "Could not start secure payment. Please try again.", "error");
                }

            };

            const handleUpdateOrderStatus = async (orderId, newStatus) => {

                triggerToast(`Successfully added: ${createdProduct.title}`);
                
                setNewProduct({

                e.preventDefault();

                setUserChatInput('');
                setIsAiTyping(true);

                setTimeout(() => {
                    const promptLower = userMsg.toLowerCase();
                    let reply = "I can help you browse through our store catalog! ";
                    
                    if (promptLower.includes('sale') || promptLower.includes('discount') || promptLower.includes('cheap') || promptLower.includes('deal')) {
                        const saleItems = products.filter(p => p.salePrice !== null);
                        reply = `We have active clearance sales on budget-friendly products today:\n\n` + 
                                saleItems.map(p => `• **${p.title}** - Special Price: ₹${p.salePrice} (M.R.P. ₹${p.price}!)`).join('\n');
                    } 
                    else if (promptLower.includes('tws') || promptLower.includes('earbuds') || promptLower.includes('headphone') || promptLower.includes('bud')) {
                        reply = "Check out our premium TWS audio selections:\n" +
                                "• **BudSync TWS Wireless Earbuds**: Special pricing at only **₹299**! Excellent battery backup & rich bass.\n" +
                                "• **SoundWave ANC Wireless Headphones**: Advanced active noise cancellation at ₹8,999.";
                    }
                    else if (promptLower.includes('powerbank') || promptLower.includes('battery') || promptLower.includes('charging') || promptLower.includes('power bank')) {
                        reply = "Check out our dynamic portable charger:\n" +
                                "• **BudSync Ultra-Slim 10000mAh Power Bank**: Listed at an unbelievable price of only **₹199**! Pocket-sized convenience.";
                    }
                    else if (promptLower.includes('tshirt') || promptLower.includes('tee') || promptLower.includes('t-shirt')) {
                        reply = "Upgrade your casual apparel:\n" +
                                "• **Classic Soft Cotton Crewneck Tee**: Incredibly comfortable fit, available for only **₹99**!";
                    }
                    else if (promptLower.includes('jeans') || promptLower.includes('denim')) {
                        reply = "Classic blue comfort stretch jeans:\n" +
                                "• **Classic Slim-Fit Denim Comfort Jeans**: Vintage finish comfort jeans available for **₹399**!";
                    }

                    }

                    setChatMessages(prev => [...prev, { sender: 'assistant', text: reply }]);
                    setIsAiTyping(false);
                }, 1000);

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col font-sans text-gray-800 antialiased select-none">
                    
                    {/* Header Strip */}

                        <Icon name="Percent" className="h-4 w-4 animate-bounce" />
                        <span>FESTIVE SALE! Save big with 18% GST benefits and free PAN-India express home delivery on all order checkouts today!</span>
                    </div>

                            {/* Brand Logo */}

                                <div className="bg-indigo-600 text-white p-2 rounded-lg shadow-md group-hover:bg-indigo-700 transition">
                                    <Icon name="ShoppingBag" className="h-6 w-6" />

                                <span className="font-extrabold text-2xl tracking-tight bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-800 bg-clip-text text-transparent">
                                    Shopify<span className="text-gray-900">.Lite</span>
                                </span>

                            {/* Catalog Search Bar */}
                            <div className="hidden md:flex flex-1 max-w-lg relative">
                                <Icon name="Search" className="absolute left-3 top-2.5 h-5 w-5 text-gray-400" />
                                <input
